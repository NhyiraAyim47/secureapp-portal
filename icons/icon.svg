<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172b45" />
      <stop offset="50%" stop-color="#1f3c64" />
      <stop offset="100%" stop-color="#0e1b2e" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a7cf8" />
      <stop offset="100%" stop-color="#1352b0" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc857" />
      <stop offset="100%" stop-color="#e0921a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="210" stroke="rgba(42, 124, 248, 0.25)" stroke-width="6" fill="none" />

  <!-- Shield Shape -->
  <g filter="url(#shadow)">
    <path d="M 256 90 L 380 145 C 380 270 256 385 256 385 C 256 385 132 270 132 145 Z" fill="url(#shield)" stroke="#589bff" stroke-width="4" />
    
    <!-- Padlock inside shield -->
    <!-- Shackle -->
    <path d="M 216 230 L 216 195 A 40 40 0 0 1 296 195 L 296 230" fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round" />
    <!-- Padlock Body -->
    <rect x="196" y="225" width="120" height="96" rx="20" fill="url(#gold)" stroke="#d97a00" stroke-width="3" />
    <!-- Keyhole -->
    <circle cx="256" cy="265" r="12" fill="#172b45" />
    <path d="M 250 268 L 262 268 L 265 295 L 247 295 Z" fill="#172b45" />
  </g>
</svg>
